<!-- GANJIL GENAP -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let angka=prompt("masukan bilangan: ");
        function cekganjilgenap(angka) {
        if (angka % 2 === 0){
           return "genap";
        } else {
           return "ganjil";
        }
        }

        alert(cekganjilgenap(number(angka)));
        
    </script>
</body>
</html>
